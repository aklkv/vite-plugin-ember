version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - 'dependencies'
      - 'internal'
    # Actions are pinned to commit SHAs, so every release becomes an update;
    # batch them like the npm updates below.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - 'dependencies'
      - 'internal'
    ignore:
      # TypeScript 7 drops the JS API that typescript-eslint and Glint's
      # ember-tsc load; stay on 6.x until both support it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major
