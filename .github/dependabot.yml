version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - 'dependencies'
      - 'internal'
    # Actions are pinned to commit SHAs, so every release becomes an update;
    # batch them like the npm updates below.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - 'dependencies'
      - 'internal'
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major
